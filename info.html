<style>
  /* 色・文字は NYK管理システムに合わせる（将来そのまま組み込めるように） */
  :root { --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --soft:#eef1f4; --text:#1d2329; --faint:#6b7480; --accent:#b23a22; --blue:#2f6fb5; --green:#2e8b57; --yellow:#fff6d6; --red:#c0392b; --navy:#1c2a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .app.big { zoom: 1.15; }
  /* 画面の大きさで自動調整（スマホ＝今のまま／タブレット・パソコン＝幅を広げて文字も少し大きく）。
     --z は全体の倍率。お知らせ・確認の窓（#layer など）も同じ倍率にする */
  :root { --z: 1; }
  .app { zoom: var(--z); }
  .app.big { zoom: calc(var(--z) * 1.15); }
  /* 倍率をかけても高さは画面ぴったり（余計なスクロールを出さない） */
  .app { min-height: calc(100vh / var(--z)); }
  .app.big { min-height: calc(100vh / var(--z) / 1.15); }
  #layer, #upd, #feat { zoom: var(--z); }
  @media (min-width: 720px) and (min-height: 560px) { :root { --z: 1.1; } .app { max-width: 800px; } }
  @media (min-width: 1100px) and (min-height: 600px) { :root { --z: 1.2; } .app { max-width: 860px; } }
  /* 1920×1080（拡大125%）などの広いパソコン画面：もう少し広げる */
  @media (min-width: 1400px) and (min-height: 600px) { .app { max-width: 1040px; } }
  /* 注文タブ（天柳事業所管理の表）はタブレット・パソコンでは横幅いっぱいに使う */
  @media (min-width: 720px) and (min-height: 560px) { body.tyOn .app { max-width: none; } }
  /* 上の帯（ロゴ3：ダークヘッダー） */
  .top { position: sticky; top: 0; z-index: 5; background: #fff; }
  .bar { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: linear-gradient(135deg, #1c2a3a, #26384d); border-bottom: 3px solid #d0452b; }
  .logo-en { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 21px; color: #fff; letter-spacing: 2px; }
  .logo-jp { font-weight: 900; font-size: 15px; color: #dbe4ee; border-left: 2px solid rgba(255,255,255,.3); padding-left: 10px; flex: 1; white-space: nowrap; }
  .me { font-size: 12px; color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 4px 10px; font-weight: 700; white-space: nowrap; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  /* 注文タブ：天柳事業所管理（同じ場所の tenryu.html）を中に表示する */
  .tyv { position: relative; background: #fff; }
  .tyv[hidden] { display: none; }
  body.tyOn .app { min-height: 0; }
  .tyv iframe { display: block; width: 100%; height: 100%; border: 0; }
  .tyld { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 14px; }
  .ordc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; text-align: center; line-height: 1.6; }
  .ordc h3 { margin: 0 0 6px; font-size: 18px; }
  .ordc p { margin: 0 0 14px; font-size: 13.5px; color: var(--faint); }
  .ordc a.btn { display: block; text-decoration: none; }
  .tabs button { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 0 5px; font-size: 12px; color: var(--faint); font-weight: 700; background: none; border: 0; border-bottom: 3px solid transparent; }
  .tabs em { font-style: normal; font-size: 17px; line-height: 1.25; }
  .tabs .on { color: var(--accent); border-bottom-color: var(--accent); }

  /* 日付の帯：横にスクロールして選ぶ（過去の日も選べる） */

  .dd { flex: none; width: 44px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; padding: 3px 0; font-size: 15px; background: none; border: 0; }

  .done .cb { background: var(--green); border-color: var(--green); }

  .plain { padding: 6px 0; border-top: 1px solid var(--soft); font-size: 14px; line-height: 1.5; }
  .sh + .plain { border-top: 0; }
  .plain .sub { margin-left: 1em; }
  .note { font-size: 12px; color: var(--faint); margin: 4px 2px; }
  .row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--soft); }
  .sh + .row, .dh + .row { border-top: 0; }
  .row .tb { padding-top: 3px; }
  .rt { line-height: 1.45; }
  .bsup { font-weight: 800; line-height: 1.5; }
  .bn { display: flex; line-height: 1.6; } .bn b { font-weight: 800; } .bdot { flex: none; color: #6b7480; }
  .bst { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: #4a535c; background: #eef1f4; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
  .bx { display: flex; flex-wrap: nowrap; gap: 4px; margin: 1px 0 2px; white-space: nowrap; }
  .bx span { font-size: 11px; font-weight: 700; color: #2f6fb5; background: #e8f0fa; border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .done .bsup, .done .bn { color: #9aa4ae; text-decoration: line-through; } .done .bx span, .done .bst { opacity: .6; }
  .bd { font-size: 13px; font-weight: 900; color: #2e8b57; padding: 6px 0 2px; border-top: 1px solid var(--soft); }
  .sh + .bd { border-top: 0; }

  .k { flex: none; font-size: 11px; font-weight: 800; border-radius: 5px; padding: 2px 6px; color: #fff; margin-top: 4px; }
  .k-work { background: #c0612b; } .k-ship { background: var(--blue); } .k-buy { background: var(--green); } .k-off { background: #888; } .k-note { background: #7a5bb5; }

  /* 在庫ボード */
  .ms { padding: 7px 10px; }

  .msh b { font-size: 14px; font-weight: 900; white-space: nowrap; }

  .msr { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding: 3px 0; border-top: 1px solid var(--soft); }
  .msr:first-of-type { border-top: 0; }

  .msc { font-size: 12px; color: var(--faint); font-weight: 700; white-space: nowrap; }
  .msc b, .mst b { font-family: Montserrat, "Zen Kaku Gothic New", sans-serif; color: var(--text); font-size: 15px; margin-left: 3px; }
  .mst { margin-left: auto; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .kg { padding: 7px 10px; }
  .kg.ed { border-color: var(--blue); }
  .kgh { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .kgh b { font-size: 14px; font-weight: 900; white-space: nowrap; }
  .kgw { font-size: 11px; color: var(--faint); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .kg.ed .kgw { color: var(--blue); }
  .kgeb { margin-left: auto; flex: none; font: inherit; font-size: 12px; font-weight: 800; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  .kgg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 12px; }
  .kgr { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px; padding: 3px 0; border-top: 1px solid var(--soft); min-width: 0; }

  .kgv small { font-size: 11px; font-weight: 700; color: var(--faint); font-family: "Zen Kaku Gothic New", sans-serif; margin: 0 1px; }
  .kgi { display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--faint); font-weight: 700; white-space: nowrap; }

  .kgi input.p { width: 24px; }

  .kgtop { display: flex; gap: 6px; }
  .kgbx { border-radius: 9px; padding: 4px 8px; min-width: 0; }

  .kgtot { background: #eaf2fb; color: #1f4f86; flex: 0 0 40%; }
  .kgok { background: #eaf5ee; color: #1f6b42; flex: 1; }
  .kgng { background: #fdecea; color: #a12b1f; flex: 1; }

<script>
(function () {
  'use strict';
  // ============================================================
  // サーバーとのやりとり（Google 専用なのはここだけ。NYK管理システムに入れるときはここを差し替える）
  // ============================================================
  function api(name, args) {
    return new Promise(function (resolve, reject) {
      if (window.__mockApi) { window.__mockApi(name, args || []).then(resolve, reject); return; }

      if (window.NYK_API) {

          .then(function (x) { return x.json(); })
          .then(function (j) { if (!j || j.err) { reject(new Error(j ? j.err : 'NG')); } else { resolve(j.r); } }, reject);
        return;
      }

  }
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } },

    del: function (k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
  };
  var NAMES = ['関', '佐藤', '啓太', '要三', '松澤', '鈴木', '小林', '翔', '高橋'];

  // ============================================================
  // 日付・文字の部品
  // ============================================================
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); }

  function wcls(s) { var w = wday(s); return w === 0 ? ' sun' : w === 6 ? ' sat' : ''; }

  // ============================================================
  // カレンダーの文字（議事録エディタと同じ形）を読む
  // ============================================================
  var TYPES = { '仕入': 'buy', '作業': 'work', '納品': 'ship', '休み': 'off', 'メモ': 'note' };
  var LABEL = { buy: '仕入', work: '作業', ship: '納品', off: '休み', note: 'メモ' };
  var RANK = { off: 0, work: 1, ship: 2, buy: 3, note: 4 };
  function parseCal(text) {
    var res = { days: {}, periods: [], orders: [], unpriced: [], policies: [], stock: [], periodTitle: '今後の予定' };
    var mode = null, cur = null, now = new Date();
    var toYmd = function (t) {
      var m = String(t || '').match(/(\d{1,2})\/(\d{1,2})/); if (!m) { return ''; }
      var y = now.getFullYear(); if (+m[1] < now.getMonth() + 1 - 6) { y++; } else if (+m[1] > now.getMonth() + 1 + 6) { y--; }
      return ymd(new Date(y, +m[1] - 1, +m[2]));
    };
    String(text || '').split('\n').forEach(function (raw) {
      var line = raw.trim(); if (!line) { return; }
      var m;
      if (/^【要発注】/.test(line)) { mode = 'o'; return; }
      if (/^【単価未登録】/.test(line)) { mode = 'u'; return; }
      if (/^【方針】/.test(line)) { mode = 'pl'; return; }
      if (/^【在庫】/.test(line)) { mode = 'st'; return; }
      if ((m = line.match(/^【(\d{1,2})\/(\d{1,2})/))) {
        mode = 'd'; var y = now.getFullYear(); if (+m[1] < now.getMonth() + 1 - 6) { y++; } else if (+m[1] > now.getMonth() + 1 + 6) { y--; }
        cur = ymd(new Date(y, +m[1] - 1, +m[2])); res.days[cur] = res.days[cur] || []; return;
      }
      if ((m = line.match(/^【([^0-9】][^】]*)】/))) { mode = 'p'; res.periodTitle = m[1]; return; }
      // 【在庫】の行：種類（数えた・使った・入った）｜日付｜品目｜数量｜メモ（見出しの判定のあとで読む）
      if (mode === 'st') {
        var g = line.replace(/^(?:新規|【新規】|🆕)[\s　:：]*/, '').split(/[｜|]/).map(function (s) { return s.trim(); });
        var q = String(g[3] || '').match(/([\d.]+)/), neg = /^[\s　]*[-−－ー]/.test(String(g[3] || ''));
        if (g[2] && q) { res.stock.push({ kind: g[0], date: toYmd(g[1]), item: g[2], qty: +q[1], neg: neg, memo: g[4] || '', raw: line.replace(/^(?:新規|【新規】|🆕)[\s　:：]*/, '') }); }
        return;
      }
      var isNew = false, nm = line.match(/^(?:新規|【新規】|🆕)[\s　:：]*/);
      if (nm) { isNew = true; line = line.slice(nm[0].length); }
      var f = line.split(/[｜|]/).map(function (s) { return s.trim(); });
      if (mode === 'o') {
        if (f.length >= 6) { res.orders.push({ item: f[0], date: f[1], work: f[2], to: f[3], qty: f[4], stock: f[5], hq: f[6] || '', buy: f[7] || '', isNew: isNew }); }
        else { res.orders.push({ item: f[0], date: f[1], work: '', to: f[2], qty: f[3], stock: f[4], isNew: isNew }); }
        return;
      }
      if (mode === 'u') { res.unpriced.push({ item: f[0], date: f[1], work: f[2], to: f[3], qty: f[4], isNew: isNew }); return; }
      if (mode === 'pl') { res.policies.push({ date: f.length > 1 ? f[0] : '', s: f.length > 1 ? f.slice(1).join('｜') : f[0], isNew: isNew }); return; }
      var tm = line.match(/^(仕入|作業|納品|休み|メモ)[：:]\s*(.*)$/);
      var it = tm ? { t: TYPES[tm[1]], s: tm[2] } : { t: mode === 'p' ? 'work' : 'note', s: line };
      it.isNew = isNew;
      if (mode === 'p') {
        var p = it.s.split(/[｜|]/);
        if (p.length < 2) { var wm = it.s.match(/^((?:\d{1,2}月)?[\d上中下旬第週日ごろ（）()\/]*(?:～|〜))\s*(.+)$/); if (wm && /\d/.test(wm[1])) { p = [wm[1], wm[2]]; } }
        res.periods.push({ t: it.t, when: p.length > 1 ? p[0] : '', s: p.length > 1 ? p.slice(1).join('｜') : p[0], isNew: isNew });

    });

    res.policies = res.policies.map(function (p, j) { p.j = j; return p; }).sort(function (a, b) { return (pkey(b) - pkey(a)) || (b.j - a.j); });

      res.days[k] = res.days[k].map(function (x, j) { x.j = j; return x; }).sort(function (a, b) { return (RANK[a.t] - RANK[b.t]) || (a.j - b.j); });

  }
  // 要発注の詳細：入っている欄だけ出す（納品・作業・納品先／注文・在庫）
  function ordDet(o) {
    var a = [], b = [], h = [], v = function (x) { return String(x || '').trim(); };
    if (v(o.buy)) { h.push('仕入希望日：' + v(o.buy)); } if (v(o.hq)) { h.push('発注数：' + v(o.hq)); }

  function ordWhen(o) {

  }
  function ordSort(list) { return list.map(function (o, j) { return { o: o, j: j, k: ordWhen(o) }; }).sort(function (x, y) { return x.k < y.k ? -1 : x.k > y.k ? 1 : x.j - y.j; }).map(function (x) { return x.o; }); }
  function shortage(o) {

  function parseMinutes(text) {

      var line = raw.replace(/\s+$/, ''), t = line.trim(), m;

  }
  function todoOf(text) {

  }
  // その日の作業（議事録の ToDo、なければカレンダーの「作業」）

  //   今日までの分だけ計算し、先の日の仕入・納品は「予定」として表示だけする
  // ============================================================
  var STOCK = [{ name: '鶏もも200up', low: 85 }, { name: '鶏もも260/280', low: 85 }, { name: '鶏もも53/58', low: 75 }];
  var TY = [['a', '鶏もも260/280'], ['b', '鶏もも53/58'], ['c', '鶏もも200up']];   // 天柳事業所で使った鶏もも（入力欄）
  function qtyOf(s, name) {

    if (!al.length) { return { from: '9999-99-99', now: 0, ev: [] }; }
    var from = al.map(function (x) { return x.date; }).sort()[0], now = 0, use = {}, src = {};
    Object.keys(c.days).forEach(function (d) {
      if (d < from || d > t) { return; }
      c.days[d].forEach(function (x) {
        var q = qtyOf(x.s, st.name);
        if (q !== null && !isNaN(q) && x.t === 'work' && /天柳事業所/.test(x.s) && !/解凍分/.test(x.s)) { use[d] = (use[d] || 0) + q; src[d] = st.name + ' ' + use[d] + 'c/s'; }

    var tyk = TY.filter(function (y) { return y[1] === st.name; })[0], tyd = S.data.tenryu || {};

    Object.keys(use).forEach(function (d) { ev.push({ date: d, q: use[d], sign: -1, s: src[d] || '' }); });
    ev.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : b.sign - a.sign; });
    ev.forEach(function (e) { now += e.sign * e.q; e.after = Math.round(now * 100) / 100; });

  // hist：在庫の動き（過去1週間）用。1週間前より前で最後に数えた日から計算し、そのあと数えた日は「数えた」行で置き直す
  function stockCalc(st, hist) {

      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

      c.stock.forEach(function (x) { if (x.item === st.name && /入/.test(x.kind) && x.date && x.date <= t && (!fd || x.date < fd)) { fd = x.date; } });

      if (r.tenryu && JSON.stringify(r.tenryu) !== JSON.stringify(S.data.tenryu || {})) { S.data.tenryu = r.tenryu; kc = true; }
      if (r.direct && JSON.stringify(r.direct) !== JSON.stringify(S.data.direct || {})) { S.data.direct = r.direct; kc = true; }
      if (ch) { S.data.checks = r.checks; } if (kc) { S.data.karaage = r.karaage; }
      if ((ch || kc) && S.tab !== 'search' && !S.screen && !S.kgEdit && !S.tyEdit && !S.kdEdit && !S.mvEdit) { render(); }
    }).catch(function () { toast('つながりません。電波を確認してください', true); });
  }
  function onErr(e) {
    if (String(e && e.message || e).indexOf('AUTH') >= 0) { showLock(); return; }
    toast('読み込めませんでした', true);
  }
  function showLock() {
    store.del('nykKey'); S.key = ''; S.data = null;
    $('lock').hidden = false; $('tabs').hidden = true; $('strip').hidden = true; $('view').hidden = true; $('me').hidden = true;
    setTimeout(function () { $('pass').focus(); }, 50);
  }
  $('lock').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pass = $('pass').value; if (!pass.trim()) { return; }
    $('open').disabled = true; $('perr').hidden = true; $('inp').classList.remove('err');
    api('login', [pass]).then(function (r) {
      $('open').disabled = false;
      if (!r.ok) { $('perr').hidden = false; $('inp').classList.add('err'); return; }
      S.key = r.key; store.set('nykKey', r.key, $('keep').checked); $('pass').value = '';
      $('view').innerHTML = '<div class="empty">読み込み中…</div>'; $('view').hidden = false; $('lock').hidden = true;
      load();
    }).catch(function () { $('open').disabled = false; toast('つながりません。電波を確認してください', true); });
  });
  $('eye').addEventListener('click', function () { var p = $('pass'); p.type = p.type === 'password' ? 'text' : 'password'; this.textContent = p.type === 'password' ? '👁 表示' : '🙈 隠す'; });

  // ============================================================
  // 操作
  // ============================================================
  $('tabs').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) { go(b.getAttribute('data-tab')); } });
  $('me').addEventListener('click', function () { showName(false); });
  // 右上のメニュー（天柳事業所管理を開く）
  // 店舗直送の入力（選んだ店舗・数を覚える。合計だけ書き直す）
  function mvInput(ev) {
    var el = ev.target, e = S.mvEdit; if (!e || !el.hasAttribute) { return; }
    if (el.hasAttribute('data-mvi')) { var x = e.rows[+el.getAttribute('data-mvi')]; if (!x) { return; } x.v = el.value.normalize('NFKC').replace(/[^\d.]/g, ''); el.classList.toggle('ed', mvEd(x)); return; }
    if (el.hasAttribute('data-mva')) { var a = e.adds[+el.getAttribute('data-mva')]; if (!a) { return; } a[el.getAttribute('data-f')] = el.getAttribute('data-f') === 'v' ? el.value.normalize('NFKC').replace(/[^\d.]/g, '') : el.value; }
  }
  document.addEventListener('input', mvInput);
  document.addEventListener('change', mvInput);
  function kdInput(ev) {
    var el = ev.target, e = S.kdEdit; if (!e || !el.hasAttribute) { return; }
    if (el.hasAttribute('data-kds')) { e.l[+el.getAttribute('data-kds')][0] = el.value; }
    else if (el.hasAttribute('data-kdn')) { e.l[+el.getAttribute('data-kdn')][1] = el.value.normalize('NFKC').replace(/[^\d.]/g, ''); }
    else { return; }
    var sum = e.l.reduce(function (a, x) { var n = +x[1]; return a + (x[0] && n > 0 ? n : 0); }, 0), sb = document.querySelector('.kdsum b'); if (sb) { sb.textContent = Math.round(sum * 100) / 100; }
  }
  document.addEventListener('input', kdInput);
  document.addEventListener('change', kdInput);
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b && S.data && !ev.target.closest('.tyin')) { var sb = ev.target.closest('[data-stock]'); if (sb) { var sn0 = sb.getAttribute('data-stock'); S.stockOpen = S.stockOpen === sn0 ? '' : sn0; render(); return; } }
    if (!b && ev.target.classList && ev.target.classList.contains('mnimg')) { ev.target.classList.toggle('zm'); return; }
    if (!b && ev.target.hasAttribute && ev.target.hasAttribute('data-kgmask')) { $('layer').innerHTML = ''; return; }
    if (!b) { var kt = ev.target.closest('[data-kgtap]'); if (kt && S.data && !S.kgEdit) { S.kgHist = !S.kgHist; render(); } return; }
    if (b.hasAttribute('data-upd')) { var ua = b.getAttribute('data-upd'); closeUpd(); if (ua === 'min') { go('min', b.getAttribute('data-date')); } else if (ua === 'cal') { go('cal', today()); } return; }
    if (b.hasAttribute('data-feat')) {
      var fs1 = featNew(); featSeen(); $('feat').innerHTML = '';
      if (b.getAttribute('data-feat') === 'ok') { if (fs1.length === 1 && fs1[0].man) { manOpen(fs1[0].man); } else { showHelp(); } }
      return;
    }
    if (b.hasAttribute('data-dlg')) { var cb = confirmBox.cb; $('layer').innerHTML = ''; confirmBox.cb = null; if (b.getAttribute('data-dlg') === '1' && cb) { cb(); } return; }
    if (b.id === 'lockhelp' || b.id === 'helpopen' || b.id === 'homehelp') { showHelp(); return; }
    if (b.id === 'helpclose' || b.id === 'helpclose2') { closeHelp(); return; }
    if (b.hasAttribute('data-man')) { manOpen(b.getAttribute('data-man')); return; }
    if (!S.data) { return; }
    if (b.hasAttribute('data-name')) { S.pickName = b.getAttribute('data-name'); render(); return; }
    if (b.hasAttribute('data-big')) { var big = b.getAttribute('data-big') === '1'; $('app').classList.toggle('big', big); store.set('nykBig', big ? '1' : ''); render(); return; }
    if (b.id === 'nameok') {
      var n = (S.pickName != null ? S.pickName : S.name || '').trim(); if (!n) { return; }
      S.name = n; store.set('nykName', n); S.pickName = null; S.screen = ''; render(); window.scrollTo(0, 0); toast(n + ' で登録しました'); checkUpd(false); return;
    }
    if (b.id === 'namecancel') { S.pickName = null; S.screen = ''; render(); return; }
    if (b.hasAttribute('data-kd')) {
      var kda = b.getAttribute('data-kd');
      if (kda === 'open') { var dl0 = ((S.data.direct || {})[b.getAttribute('data-d')] || {}).l || []; S.kdEdit = { d: b.getAttribute('data-d'), l: dl0.length ? dl0.map(function (x) { return [x[0], String(x[1])]; }) : [['', '']] }; kdDraw(); return; }
      if (!S.kdEdit) { return; }
      if (kda === 'add') { S.kdEdit.l.push(['', '']); kdDraw(); return; }
      if (kda === 'del') { S.kdEdit.l.splice(+b.getAttribute('data-i'), 1); kdDraw(); return; }
      if (kda === 'cancel') { S.kdEdit = null; $('layer').innerHTML = ''; return; }
      if (kda === 'save') { kdSave(); return; }
      return;
    }
    if (b.hasAttribute('data-kg')) {
      var ka = b.getAttribute('data-kg');
      if (ka === 'tbl') { kgTable(); return; }
      if (ka === 'edit') {
        var lk0 = kgLatest(today()), rc = lk0.d === today() || today() < KG_TOTAL_FROM ? lk0.rec : null, ev0 = {};
        KG.forEach(function (k) { var a = rc && rc.v && rc.v[k[0]] || []; ev0[k[0]] = [String(a[0] || ''), String(a[1] || '')]; });
        S.kgEdit = ev0; S.kgEditDate = today(); render(); var fi = document.querySelector('[data-kgi]'); if (fi) { fi.focus(); } return;
      }
      // 前日製造分の入力（空欄から）
      if (ka === 'prev' || ka === 'mon') {
        var ev1 = {}; KG.forEach(function (k) { ev1[k[0]] = ['', '']; });
        S.kgEdit = ev1; S.kgEditDate = ka === 'mon' ? addDays(today(), -1) : kgPrevDay(kgBaseDay(today())); S.kgHist = false; render(); var fp = document.querySelector('[data-kgi]'); if (fp) { fp.focus(); } return;
      }
      if (ka === 'fillrest') { var lb2 = kgLeftBy(S.kgEditDate || today()); if (lb2) { lb2.left.forEach(function (x) { S.kgEdit[x[0]] = kgSplit(x[2]); }); render(); } return; }
      if (ka === 'cancel') { S.kgEdit = null; S.kgEditDate = ''; render(); return; }
      if (ka === 'save') { kgSave(); return; }
      return;
    }
    if (b.hasAttribute('data-mv')) {
      var mva = b.getAttribute('data-mv');
      if (mva === 'open') { S.mvEdit = { n: b.getAttribute('data-n'), rows: mvRows(b.getAttribute('data-n')), adds: [] }; mvDraw(); return; }
      if (!S.mvEdit) { return; }
      if (mva === 'cancel') { S.mvEdit = null; $('layer').innerHTML = ''; return; }
      if (mva === 'add') { S.mvEdit.adds.push({ d: today(), kind: '解凍', v: '' }); mvDraw(); var ls = document.querySelector('.mvls'); if (ls) { ls.scrollTop = ls.scrollHeight; } return; }
      if (mva === 'del') { S.mvEdit.adds.splice(+b.getAttribute('data-i'), 1); mvDraw(); return; }
      if (mva === 'save') { mvSave(); return; }
      return;
    }
    if (b.hasAttribute('data-ty')) {
      var ta = b.getAttribute('data-ty');
      if (ta === 'edit') {
        var tk0 = b.getAttribute('data-tyk'), tr0 = (S.data.tenryu || {})[today()];
        S.tyEdit = { k: tk0, v: String(tr0 && tr0.v && tr0.v[tk0] || '') }; render(); var ti = document.querySelector('[data-tyi]'); if (ti) { ti.focus(); ti.select(); } return;
      }
      if (ta === 'cancel') { S.tyEdit = null; render(); return; }
      if (ta === 'save') { tySave(); return; }
      return;
    }
    if (b.hasAttribute('data-stock')) { var sn = b.getAttribute('data-stock'); S.stockOpen = S.stockOpen === sn ? '' : sn; render(); return; }
    if (b.hasAttribute('data-key')) { toggleCheck(b.getAttribute('data-key')); return; }
    if (b.hasAttribute('data-open')) { var id = b.getAttribute('data-open'); S.open = S.open === id ? '' : id; render(); return; }
    if (b.hasAttribute('data-min')) { var m = b.getAttribute('data-min'); if (m) { S.minDate = m; render(); window.scrollTo(0, 0); } return; }
    if (b.hasAttribute('data-cal')) { go('cal', b.getAttribute('data-cal')); return; }
    if (b.hasAttribute('data-go')) {
      var to = b.getAttribute('data-go'), d = b.getAttribute('data-date');
      if (to === 'min' && !d) { go('cal', today()); return; }
      go(to, d, b.getAttribute('data-sec')); return;
    }
    if (b.hasAttribute('data-kf')) { S.kindF = b.getAttribute('data-kf'); render(); return; }
    if (b.hasAttribute('data-tf')) { S.timeF = b.getAttribute('data-tf'); render(); return; }
    if (b.hasAttribute('data-hit')) {
      var x = S.hits[+b.getAttribute('data-hit')];
      if (x.kind === '議事録') { go('min', x.date); }
      else if (x.date) { go('cal', x.date); }
      else { go('cal', '', x.sec); }
    }
  });
  document.addEventListener('input', function (ev) {
    var kgi = ev.target.getAttribute && ev.target.getAttribute('data-kgi');
    var tyi = ev.target.getAttribute && ev.target.getAttribute('data-tyi');
    if (tyi && S.tyEdit) {
      var tv = ev.target.value.normalize('NFKC').replace(/[^\d.]/g, '').slice(0, 7);
      if (tv !== ev.target.value) { ev.target.value = tv; }
      S.tyEdit.v = tv; return;
    }
    if (kgi && S.kgEdit) {
      var kp = kgi.split('|'), kv = ev.target.value.normalize('NFKC').replace(/[^\d.]/g, '').slice(0, 7);
      if (kv !== ev.target.value) { ev.target.value = kv; }
      S.kgEdit[kp[0]][+kp[1]] = kv; return;
    }
    if (ev.target.id === 'oname') {
      S.pickName = ev.target.value.trim();
      var ok = $('nameok'); ok.disabled = !S.pickName; ok.textContent = S.pickName ? S.pickName + ' で' + (S.screen === 'name1' ? '始める' : '決定') : '名前を選んでください';
      document.querySelectorAll('.nb').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-name') === S.pickName); });
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.hasAttribute && ev.target.hasAttribute('data-tyi')) { ev.preventDefault(); tySave(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.hasAttribute && ev.target.hasAttribute('data-stock')) { ev.preventDefault(); ev.target.click(); return; }
    if (ev.key !== 'Enter' || !ev.target.hasAttribute || !ev.target.hasAttribute('data-kgi')) { return; }
    ev.preventDefault();
    var all = Array.prototype.slice.call(document.querySelectorAll('[data-kgi]')), i = all.indexOf(ev.target);
    if (i >= 0 && i < all.length - 1) { all[i + 1].focus(); all[i + 1].select(); } else { kgSave(); }
  });
  document.addEventListener('submit', function (ev) { if (ev.target.id === 'sform') { ev.preventDefault(); doSearch($('q').value); $('q').blur(); } });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'hideDone') { S.hideDone = ev.target.checked; store.set('nykHideDone', S.hideDone ? '1' : ''); render(); }
  });
  S.hideDone = store.get('nykHideDone') === '1';

  if (S.key) { $('view').hidden = false; $('view').innerHTML = '<div class="empty">読み込み中…</div>'; load(); } else { showLock(); }
  setInterval(poll, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); } });
})();
</script>
</body>
</html>
